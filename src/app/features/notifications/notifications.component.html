<div class="notifications-page">
  <header class="notifications-page__header">
    <h1 class="notifications-page__title">Notifications</h1>
    @if (hasUnread()) {
      <button
        type="button"
        class="notifications-page__mark-all"
        (click)="markAllAsRead()"
      >
        <lucide-icon [img]="CheckCheck" [size]="20"></lucide-icon>
        Mark all as read
      </button>
    }
  </header>

  <section class="notifications-page__list">
    @if (notifications().length === 0) {
      <p class="notifications-page__empty">No notifications yet.</p>
    } @else {
      <ul class="notifications-page__ul">
        @for (n of notifications(); track n.id) {
          @let actor = getUserById(n.actorId);
          <li class="notifications-page__item">
            <button
              type="button"
              class="notifications-page__row"
              [class.notifications-page__row--unread]="!n.read"
              (click)="markAsRead(n.id)"
            >
              @if (actor) {
                <img
                  [src]="actor.avatarUrl"
                  [alt]="actor.displayName"
                  class="notifications-page__avatar"
                  width="44"
                  height="44"
                />
                <div class="notifications-page__content">
                  <span class="notifications-page__text">
                    <span class="notifications-page__username">{{ actor.username }}</span>
                    {{ n.text }}
                  </span>
                  <time class="notifications-page__time" [attr.datetime]="n.timestamp">
                    {{ relativeTime(n.timestamp) }}
                  </time>
                </div>
                @if (!n.read) {
                  <span class="notifications-page__dot" aria-hidden="true"></span>
                }
              }
            </button>
          </li>
        }
      </ul>
    }
  </section>
</div>
