<div class="home">
  <app-stories />
  <section class="home-feed">
    @for (p of posts; track p.id) {
      @let author = getUserById(p.userId);
      @if (author) {
        <app-post
          [post]="p"
          [user]="author"
          [comments]="getCommentsForPost(p.id)"
          [getUserById]="getUserByIdRef"
        />
      }
    }
  </section>
</div>
