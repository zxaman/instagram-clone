<div class="layout">
  <aside class="layout__left">
    <app-left-sidebar />
  </aside>
  <main class="layout__center" [class.layout__center--full-width]="isMessagesRoute()">
    <router-outlet />
  </main>
  @if (!isMessagesRoute()) {
    <aside class="layout__right">
      <app-right-sidebar />
    </aside>
  }
  <app-search-sidebar />
  <app-notifications-sidebar />
</div>
